# Replicated Kafka: 3 brokers, every partition stored on all 3, and a write is acknowledged only once
# 2 of them have it (the producer's acks=all + min.insync.replicas=2). Any one broker can crash
# mid-sale without losing an acknowledged order or stopping sales. See docs/SCALING.md and
#   powershell -ExecutionPolicy Bypass -File scripts/chaos_test.ps1 -Scenario kafka-ha
#
#   docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d
#
# A separate cluster with its own volumes (kafka-ha-1..3): the single-broker data is left as it is,
# and plain `docker compose up -d` goes back to it.

x-kafka-ha-env: &kafka-ha-env
  CLUSTER_ID: kviatsT4TwmyP6jat3XYKQ
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # order-events gets replication factor 3 and min.insync.replicas=2 from kafka-init below
  # (per topic, so the test suites' throwaway single-replica topics still work).
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
  # A dead broker is noticed after 4 s instead of the default 9 s. Until then acks=all writes wait
  # for it (it is still counted as an in-sync replica), so this is how long buys stall on a failure.
  KAFKA_BROKER_SESSION_TIMEOUT_MS: 4000
  KAFKA_BROKER_HEARTBEAT_INTERVAL_MS: 1000

x-kafka-ha-broker: &kafka-ha-broker
  image: apache/kafka:3.8.1
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
    interval: 10s
    timeout: 15s
    retries: 15
    start_period: 30s

# Every client gets all three brokers, so losing any one (including "kafka") doesn't matter.
x-ha-bootstrap: &ha-bootstrap
  KAFKA_BOOTSTRAP: kafka:9092,kafka-2:9092,kafka-3:9092

services:
  kafka:
    environment:
      <<: *kafka-ha-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
    volumes: !override
      - kafka-ha-1:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-ha-broker
    environment:
      <<: *kafka-ha-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:9095
    ports:
      - "9095:9094"
    volumes:
      - kafka-ha-2:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-ha-broker
    environment:
      <<: *kafka-ha-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:9096
    ports:
      - "9096:9094"
    volumes:
      - kafka-ha-3:/var/lib/kafka/data

  kafka-init:
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092,kafka-2:9092,kafka-3:9092 --create
        --if-not-exists --topic order-events --partitions 3 --replication-factor 3
        --config min.insync.replicas=2 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic order-events

  migrate:
    environment: *ha-bootstrap
  web:
    environment: *ha-bootstrap
  order-writer:
    environment: *ha-bootstrap
  celery-worker:
    environment: *ha-bootstrap
  celery-beat:
    environment: *ha-bootstrap
  gateway:
    environment:
      <<: *ha-bootstrap
      # Wait out a broker failover (about 4-6 s) instead of answering 503: with replication the
      # write will succeed, so a slower "yes" beats a "try again".
      PRODUCE_TIMEOUT_S: "8"

volumes:
  kafka-ha-1:
  kafka-ha-2:
  kafka-ha-3:
