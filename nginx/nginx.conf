worker_processes auto;

events {
    worker_connections 8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    off;                 # load tests generate millions of lines
    keepalive_timeout 65;

    # Docker's DNS; re-resolve every 5 s so restarted/scaled containers are picked up.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream gateway {
        zone gateway 64k;
        server gateway:8001 resolve;     # every replica of the gateway service
        keepalive 256;                   # reuse connections instead of a TCP handshake per buy
    }

    upstream web {
        zone web 64k;
        server web:8000 resolve;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        client_max_body_size 1m;

        # Hot path: buy + live stock go to the FastAPI gateway.
        location ~ ^/api/sales/\d+/(buy|stock)$ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Upstream gateway always;
        }

        # WebSocket: long-lived, upgraded connection to the gateway.
        location = /ws {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Everything else server-side is Django: auth, read APIs, admin, admin static files.
        location ~ ^/(api|admin|static)/ {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Upstream web always;
        }

        location = /nginx-health {
            return 200 "ok\n";
        }

        # React build; unknown paths fall back to index.html (single-page app).
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}
