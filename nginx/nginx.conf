worker_processes auto;

events {
    worker_connections 8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    off;                 # load tests generate millions of lines
    keepalive_timeout 65;

    # Docker's DNS; re-resolve every 5 s so restarted/scaled containers are picked up.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # The real client address. Deployed, requests arrive from Caddy or the Cloudflare tunnel inside the
    # Docker network, which put the client's IP in X-Forwarded-For; trust that header only from there.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Password guessing: at most 5 logins/s per client IP, short bursts allowed (e.g. a page of users
    # logging in from one office); beyond that 429. Buys need no limit here: Redis already allows
    # one unit per user per sale, and floods belong to the edge (Cloudflare / a load balancer).
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    limit_req_status 429;

    upstream gateway {
        zone gateway 64k;
        # Every replica of the gateway service. Tolerate a few transient errors before marking
        # a replica down, and retry it soon: with the default (1 failure, 10 s) a short Redis
        # blip made nginx mark BOTH replicas down and answer 502 for 10 s.
        server gateway:8001 resolve max_fails=5 fail_timeout=2s;
        keepalive 256;                   # reuse connections instead of a TCP handshake per buy
        keepalive_timeout 60s;           # must stay below uvicorn's --timeout-keep-alive (75 s)
    }

    # Optional extras mount their upstreams here (docker-compose.baseline.yml); empty by default.
    include /etc/nginx/upstreams.d/*.conf;

    upstream web {
        zone web 64k;
        server web:8000 resolve;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Deployed, HTTPS ends at Caddy or Cloudflare in front of nginx: keep their "https" so Django
    # knows the request was secure (admin CSRF checks, secure cookies). Locally it is just $scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;
        client_max_body_size 1m;

        # Hot path: buy + live stock go to the FastAPI gateway.
        location ~ ^/api/sales/\d+/(buy|stock)$ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Upstream gateway always;
        }

        # WebSocket: long-lived, upgraded connection to the gateway.
        location = /ws {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Logins (API token and admin form), rate-limited per client IP. Regex locations are tried in
        # order, so this one must stay above the general Django location below.
        location ~ ^/(api/auth/token|admin/login)/$ {
            limit_req zone=login burst=30 nodelay;
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            add_header X-Upstream web always;
        }

        # Everything else server-side is Django: auth, read APIs, admin, admin static files.
        location ~ ^/(api|admin|static)/ {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            add_header X-Upstream web always;
        }

        # Optional extras mount their locations here (docker-compose.baseline.yml); empty by default.
        include /etc/nginx/locations.d/*.conf;

        location = /nginx-health {
            return 200 "ok\n";
        }

        # React build; unknown paths fall back to index.html (single-page app).
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}
