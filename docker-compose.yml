name: flashcore

# Shared settings for every container that runs the Django codebase.
x-django: &django
  build: ./core
  image: flashcore-core:dev
  env_file: .env
  environment:
    LUA_DIR: /lua
    # Overridable from the shell for load tests, e.g. $env:MOCK_PAYMENT_DELAY_MS=5
    MOCK_PAYMENT_DELAY_MS: ${MOCK_PAYMENT_DELAY_MS:-100}
    PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.05}
  volumes:
    - ./core:/app                   # dev: code changes apply without rebuilding
    - ./gateway/app/lua:/lua:ro     # same Lua scripts as the gateway

services:
  postgres:
    image: postgres:16-alpine
    # Celery threads + gunicorn + order writer + test runs each hold a connection.
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk   # any base64 16-byte id; fixed so restarts reuse the same log dir
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL = other containers (kafka:9092), EXTERNAL = my machine (localhost:9094)
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 20s

  # One-shot: creates the order-events topic. Safe to run again (--if-not-exists).
  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic order-events --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic order-events
    restart: "no"

  # One-shot: applies Django migrations before any Django process starts.
  migrate:
    <<: *django
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput -v 0"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *django
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Kafka order-events -> PostgreSQL. Exits on DB errors without committing offsets;
  # the restart policy brings it back and the batch is consumed again.
  order-writer:
    <<: *django
    command: python manage.py consume_orders
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Order fulfilment (mock payment). Prefork: measured ~95 orders/s with 16 processes vs ~13/s
  # with the threads pool at prefetch 1 (~80/s at prefetch 8) on the same backlog.
  celery-worker:
    <<: *django
    command: celery -A core worker --loglevel=INFO --pool=prefork --concurrency=${CELERY_CONCURRENCY:-16}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-beat:
    <<: *django
    command: celery -A core beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Two replicas behind nginx (no host port: reach it through http://localhost).
  # `docker compose exec gateway ...` runs in replica 1; its own tests use localhost:8001 inside it.
  gateway:
    build: ./gateway
    image: flashcore-gateway:dev
    env_file: .env
    environment:
      GATEWAY_WORKERS: ${GATEWAY_WORKERS:-2}      # uvicorn processes per replica
    deploy:
      replicas: ${GATEWAY_REPLICAS:-2}
    volumes:
      - ./gateway:/app                # tests live in /app/tests; restart the container after code changes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: flashcore-nginx:dev
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]   # "localhost" resolves to IPv6 here; nginx listens on IPv4
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      gateway:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  pg-data:
  redis-data:
  kafka-data:
