# Production overrides, used on top of docker-compose.yml (see docs/DEPLOY.md):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile vm up -d --build
# On the server, COMPOSE_FILE and COMPOSE_PROFILES in .env make a plain `docker compose ...` do this.
#
# - Code is baked into the images: no bind mounts, no gunicorn --reload, DEBUG off.
# - Nothing but Caddy (profile "vm") or the Cloudflare tunnel (profile "tunnel") faces the internet:
#   Postgres, Redis, Kafka, Django and nginx publish no host ports.

x-django-prod: &django-prod
  environment:
    DJANGO_DEBUG: "0"
  volumes: !override
    - ./gateway/app/lua:/lua:ro       # the Lua scripts are not part of the core image

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  kafka:
    ports: !reset []
    environment:
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"   # default is 1 GB; plenty for a demo

  migrate:
    <<: *django-prod

  web:
    <<: *django-prod
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports: !reset []

  order-writer:
    <<: *django-prod

  celery-worker:
    <<: *django-prod

  celery-beat:
    <<: *django-prod

  gateway:
    volumes: !reset []

  nginx:
    ports: !reset []

  # Dashboards stay private on a server: Grafana listens on the VM's localhost only, reached with
  #   ssh -L 3000:localhost:3000 ubuntu@<vm>   then http://localhost:3000
  prometheus:
    ports: !reset []
  grafana:
    ports: !override
      - "127.0.0.1:3000:3000"

  # Cloud VM: HTTPS with a free, auto-renewed Let's Encrypt certificate for SITE_ADDRESS
  # (e.g. 1-2-3-4.sslip.io, a free hostname that resolves to 1.2.3.4).
  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["vm"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data            # keep certificates: Let's Encrypt rate-limits re-issuing
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy

  # Laptop: a Cloudflare quick tunnel gives nginx a public https://<random>.trycloudflare.com URL
  # (no account, no open ports). The URL changes every time this container starts.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.0
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://nginx:80
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
